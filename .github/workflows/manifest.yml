# Clean Home TV backgrounds - 2026-10-23 V2 (albums)
# Rebuilds manifest.json whenever pictures are added or removed, so the TVs pick them up automatically.
name: Update manifest
on:
  push:
    paths: ["images/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List pictures
        run: |
          python3 - <<'PY'
          import json, os, time
          exts = (".jpg", ".jpeg", ".png", ".webp")
          def pics(folder):
              return sorted(os.path.join(folder, f).replace(os.sep, "/") for f in os.listdir(folder)
                            if f.lower().endswith(exts) and os.path.isfile(os.path.join(folder, f)))
          albums = {}
          for d in sorted(os.listdir("images")):            # every sub-folder of images/ is an album
              if os.path.isdir(os.path.join("images", d)):
                  p = pics(os.path.join("images", d))
                  if p: albums[d] = p
          loose = pics("images")                            # pictures sitting directly in images/
          if loose: albums = dict([("Unsorted", loose)] + list(albums.items()))
          everything = [x for v in albums.values() for x in v]
          json.dump({"updated": int(time.time()), "images": everything, "albums": albums},
                    open("manifest.json", "w"), indent=2)
          print(len(everything), "pictures in", len(albums), "albums")
          PY
      - name: Commit
        run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Update manifest"
          git push
